<title>Grow Mate AI 診所預約</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    color-scheme: light;
    --bg:#FFF7EE;
    --bg-phone:#FFFDF9;
    --surface:#FFFFFF;
    --surface-alt:#FFF1E4;
    --text:#3B2A1E;
    --text-muted:#8A7561;
    --text-faint:#B7A491;
    --border:#EFE1D2;
    --accent:#FF6F52;
    --accent-strong:#E4552F;
    --accent-soft:#FFE3D6;
    --accent-ink:#FFFFFF;
    --success:#5E9C5B;
    --success-soft:#E4F0DF;
    --closed:#A68F7C;
    --closed-soft:#F1E9DE;
    --shadow:rgba(59,42,30,0.10);
    --shadow-strong:rgba(59,42,30,0.18);
    --chip-bg:#FFFFFF;
    --track-bg:#EFE1D2;
  }
  /* Locked to the light (cream) palette regardless of the visitor's system
     dark/light setting, so the demo looks identical for every tester. */

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
    padding-block:40px;
  }
  .display{ font-family:'LXGW WenKai TC','Noto Sans TC',serif; }

  .stage{
    max-width:1080px;
    margin:0 auto;
    padding-inline:20px;
    display:flex;
    justify-content:center;
  }

  /* ---------- intro modal ---------- */
  .intro-backdrop{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(27,19,13,0.5);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    -webkit-backdrop-filter:blur(2px);
    backdrop-filter:blur(2px);
  }
  .intro-backdrop[hidden]{ display:none; }
  .intro-modal{
    position:relative;
    width:100%;
    max-width:380px;
    max-height:88vh;
    overflow-y:auto;
    background:var(--surface);
    border-radius:22px;
    padding:28px 24px 24px;
    box-shadow:0 30px 60px var(--shadow-strong);
  }
  .intro-close{
    position:absolute;
    top:14px; right:14px;
    width:30px; height:30px;
    border-radius:9px;
    border:1px solid var(--border);
    background:var(--bg-phone);
    color:var(--text-muted);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .intro-close:hover{ background:var(--accent-soft); color:var(--accent-strong); border-color:var(--accent-soft); }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:22px;
  }
  .brand .mark{
    flex:none;
    width:40px; height:40px;
    border-radius:12px;
    background:var(--accent-soft);
    display:flex; align-items:center; justify-content:center;
    font-size:19px;
  }
  .brand .name{
    font-family:'LXGW WenKai TC',serif;
    font-size:22px;
    font-weight:700;
    color:var(--text);
  }
  .intro-modal .flow{
    border-top:1px solid var(--border);
    padding-top:18px;
    margin-bottom:24px;
  }
  .intro-modal .flow h2{
    font-size:13px;
    letter-spacing:.06em;
    color:var(--text-faint);
    margin:0 0 14px;
    font-weight:700;
  }
  .flow ol{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .flow li{
    display:flex;
    align-items:flex-start;
    gap:12px;
    font-size:14px;
    color:var(--text);
  }
  .flow .n{
    flex:none;
    width:22px;
    height:22px;
    border-radius:50%;
    background:var(--accent);
    color:var(--accent-ink);
    font-size:12px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    font-variant-numeric:tabular-nums;
    margin-top:1px;
  }
  .flow b{ display:block; }
  .flow small{ color:var(--text-muted); font-size:12.5px; }

  /* ---------- phone ---------- */
  .phone-wrap{
    flex:none;
    display:flex;
    justify-content:center;
  }
  .phone{
    width:380px;
    max-width:88vw;
    height:734px;
    max-height:82vh;
    background:var(--bg-phone);
    border-radius:26px;
    border:1px solid var(--border);
    box-shadow:0 24px 50px var(--shadow-strong);
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  .screens{
    flex:1;
    display:flex;
    width:500%;
    height:100%;
    transition:transform .4s cubic-bezier(.65,0,.35,1);
  }
  .screen{
    width:20%;
    height:100%;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .screen-head{
    flex:none;
    padding:22px 18px 14px;
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--bg-phone);
  }
  .screen-head h2{
    font-family:'LXGW WenKai TC',serif;
    font-size:19px;
    margin:0;
    flex:1;
  }
  .iconbtn{
    flex:none;
    width:32px; height:32px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--surface);
    display:flex; align-items:center; justify-content:center;
    color:var(--text);
    cursor:pointer;
  }
  .iconbtn:hover{ background:var(--accent-soft); border-color:var(--accent-soft); }
  .iconbtn{ position:relative; }
  .badge-dot{
    position:absolute;
    top:-5px; right:-5px;
    min-width:16px; height:16px;
    padding:0 3px;
    border-radius:999px;
    background:var(--accent);
    color:var(--accent-ink);
    font-size:10px;
    font-weight:700;
    line-height:16px;
    text-align:center;
    box-shadow:0 0 0 2px var(--bg-phone);
  }
  .iconbtn:focus-visible, .chip:focus-visible, .cta:focus-visible, .clinic-card:focus-visible, .slot:focus-visible, .daybtn:focus-visible{
    outline:2px solid var(--accent-strong);
    outline-offset:2px;
  }
  .scroll{
    flex:1;
    overflow-y:auto;
    padding:0 18px 24px;
  }

  /* list screen */
  .subhead{
    font-size:12.5px;
    color:var(--text-muted);
    margin:0 0 14px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .chips{
    position:relative;
    display:flex;
    gap:8px;
    overflow-x:auto;
    overscroll-behavior-x:contain;
    padding-bottom:14px;
    margin-bottom:6px;
    cursor:grab;
  }
  .chips:active{ cursor:grabbing; }
  .chips::-webkit-scrollbar{ display:none; }
  .chips::after, .days::after{
    content:"";
    position:absolute;
    top:0; right:0; bottom:14px;
    width:30px;
    background:linear-gradient(to right, transparent, var(--bg-phone));
    pointer-events:none;
  }
  .chip{
    flex:none;
    font-size:13px;
    font-weight:600;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--chip-bg);
    color:var(--text-muted);
    cursor:pointer;
    white-space:nowrap;
  }
  .chip[aria-pressed="true"]{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--accent-ink);
  }
  .clinic-list{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .clinic-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    padding:14px;
    display:flex;
    gap:12px;
    text-align:left;
    cursor:pointer;
    box-shadow:0 2px 8px var(--shadow);
  }
  .clinic-card:hover{ border-color:var(--accent); }
  .cicon{
    flex:none;
    width:50px; height:50px;
    border-radius:14px;
    background:var(--accent-soft);
    color:var(--accent-strong);
    display:flex; align-items:center; justify-content:center;
  }
  .cbody{ flex:1; min-width:0; }
  .crow1{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:3px;
  }
  .cname{
    font-family:'LXGW WenKai TC',serif;
    font-size:15.5px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .cdist{
    flex:none;
    margin-left:auto;
    font-size:12.5px;
    font-weight:700;
    color:var(--accent-strong);
    font-variant-numeric:tabular-nums;
  }
  .ctags{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
  .tag{
    font-size:11.5px;
    padding:2px 8px;
    border-radius:999px;
    background:var(--surface-alt);
    color:var(--text-muted);
    font-weight:600;
  }
  .cmeta{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:12px;
    color:var(--text-muted);
  }
  .cmeta .star{ color:var(--accent-strong); }
  .status-pill{
    font-size:11.5px;
    font-weight:700;
    padding:2px 9px;
    border-radius:999px;
  }
  .status-pill.open{ background:var(--success-soft); color:var(--success); }
  .status-pill.closed{ background:var(--closed-soft); color:var(--closed); }

  /* detail screen */
  .detail-hero{
    display:flex;
    gap:14px;
    align-items:center;
    margin-bottom:18px;
  }
  .detail-hero .cicon{ width:64px; height:64px; border-radius:18px; }
  .detail-hero h3{
    font-family:'LXGW WenKai TC',serif;
    font-size:19px;
    margin:0 0 4px;
    text-wrap:balance;
  }
  .info-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px 16px;
    margin-bottom:14px;
  }
  .info-row{
    display:flex;
    gap:10px;
    align-items:flex-start;
    font-size:13.5px;
    padding:8px 0;
    border-bottom:1px solid var(--border);
    color:var(--text);
  }
  .info-row:last-child{ border-bottom:none; padding-bottom:0; }
  .info-row:first-child{ padding-top:0; }
  .info-row svg{ flex:none; margin-top:1px; color:var(--accent-strong); }
  .info-row .lbl{ color:var(--text-muted); flex:none; width:64px; }
  .hours-table{ width:100%; border-collapse:collapse; font-size:13px; }
  .hours-table td{ padding:5px 0; }
  .hours-table td:first-child{ color:var(--text-muted); width:56px; }
  .hours-table tr.today td{ color:var(--accent-strong); font-weight:700; }
  .hours-table td.off{ color:var(--text-faint); }

  .cta{
    display:block;
    width:100%;
    text-align:center;
    padding:14px;
    border-radius:14px;
    border:none;
    background:var(--accent);
    color:var(--accent-ink);
    font-family:'Noto Sans TC',sans-serif;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 8px 20px var(--shadow);
  }
  .cta:hover{ background:var(--accent-strong); }
  .cta.ghost{
    background:transparent;
    border:1.5px solid var(--border);
    color:var(--text);
    box-shadow:none;
  }
  .cta.ghost:hover{ border-color:var(--accent); color:var(--accent-strong); }
  .cta[disabled]{ opacity:.45; cursor:not-allowed; }
  .sticky-cta{ flex:none; padding:14px 18px 20px; background:var(--bg-phone); }

  /* booking screen */
  .days{
    position:relative;
    display:flex;
    gap:8px;
    overflow-x:auto;
    overscroll-behavior-x:contain;
    padding-bottom:14px;
    margin-bottom:6px;
    cursor:grab;
  }
  .days:active{ cursor:grabbing; }
  .days::-webkit-scrollbar{ display:none; }
  .daybtn{
    flex:none;
    width:52px;
    padding:9px 0;
    border-radius:14px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .daybtn .dow{ font-size:11px; color:var(--text-muted); }
  .daybtn .dom{ font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; }
  .daybtn[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); }
  .daybtn[aria-pressed="true"] .dow, .daybtn[aria-pressed="true"] .dom{ color:var(--accent-ink); }

  .section-label{
    font-size:12.5px;
    font-weight:700;
    color:var(--text-muted);
    letter-spacing:.04em;
    margin:18px 0 10px;
  }
  .slot-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
  }
  .slot{
    padding:10px 0;
    border-radius:11px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-size:13.5px;
    font-variant-numeric:tabular-nums;
    cursor:pointer;
  }
  .slot[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:700; }
  .slot[disabled]{
    background:var(--surface-alt);
    color:var(--text-faint);
    text-decoration:line-through;
    cursor:not-allowed;
    border-color:var(--border);
  }
  .empty-note{
    font-size:13px;
    color:var(--text-muted);
    background:var(--surface-alt);
    border-radius:12px;
    padding:14px;
    text-align:center;
  }
  .booking-summary{
    margin-top:20px;
    background:var(--accent-soft);
    border-radius:14px;
    padding:12px 14px;
    font-size:13px;
    color:var(--text);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .booking-summary b{ font-family:'LXGW WenKai TC',serif; }

  /* confirm screen */
  .confirm-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:0 24px;
  }
  .check-badge{
    width:76px; height:76px;
    border-radius:50%;
    background:var(--success-soft);
    color:var(--success);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:20px;
    animation:pop .5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop{ from{ transform:scale(.4); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .confirm-wrap h3{
    font-family:'LXGW WenKai TC',serif;
    font-size:21px;
    margin:0 0 8px;
  }
  .confirm-wrap p.sub{
    font-size:13.5px;
    color:var(--text-muted);
    margin:0 0 22px;
  }
  .confirm-card{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    text-align:left;
    margin-bottom:22px;
  }
  .confirm-card .crow{
    display:flex;
    justify-content:space-between;
    font-size:13.5px;
    padding:7px 0;
    border-bottom:1px dashed var(--border);
  }
  .confirm-card .crow:last-child{ border-bottom:none; }
  .confirm-card .crow span:first-child{ color:var(--text-muted); }
  .confirm-card .crow span:last-child{ font-weight:700; text-align:right; }
  .confirm-actions{ width:100%; display:flex; flex-direction:column; gap:10px; }

  /* my bookings screen */
  .booking-list{ display:flex; flex-direction:column; gap:12px; }
  .booking-item{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px;
  }
  .booking-item.cancelled{ opacity:.6; }
  .bi-top{ display:flex; align-items:flex-start; gap:10px; margin-bottom:10px; }
  .bi-top .cicon{ width:42px; height:42px; border-radius:12px; }
  .bi-top .bi-name{ font-family:'LXGW WenKai TC',serif; font-size:15px; font-weight:700; margin-bottom:2px; }
  .bi-top .bi-spec{ font-size:12px; color:var(--text-muted); }
  .bi-status{ margin-left:auto; font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:999px; flex:none; }
  .bi-status.upcoming{ background:var(--success-soft); color:var(--success); }
  .bi-status.cancelled{ background:var(--closed-soft); color:var(--closed); }
  .bi-meta{ display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--text); margin-bottom:12px; }
  .bi-meta span.muted{ color:var(--text-muted); }
  .bi-actions{ display:flex; gap:8px; }
  .bi-actions button{
    flex:1;
    padding:9px 0;
    border-radius:11px;
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
    border:1px solid var(--border);
    background:var(--surface-alt);
    color:var(--closed);
  }
  .bi-actions button.undo{ background:var(--accent-soft); color:var(--accent-strong); border-color:var(--accent-soft); }
  .mybookings-empty{
    text-align:center;
    padding:48px 12px;
    color:var(--text-muted);
  }
  .mybookings-empty svg{ color:var(--text-faint); margin-bottom:14px; }
  .mybookings-empty p{ font-size:13.5px; margin:0 0 20px; }

  /* ---------- mobile: the "phone" becomes the whole screen ---------- */
  @media (max-width:760px){
    body{ padding-block:0; }
    .stage{ padding-inline:0; min-height:100dvh; }
    .phone-wrap{ width:100%; }
    .phone{
      width:100%;
      max-width:100%;
      height:100dvh;
      max-height:none;
      border-radius:0;
      border:none;
      box-shadow:none;
    }
  }
</style>

      hours:{ mon:[H("09:00","12:00"),H("14:00","18:00")], tue:[H("09:00","12:00"),H("14:00","18:00")],
        wed:[H("09:00","12:00"),H("14:00","18:00")], thu:[H("09:00","12:00"),H("14:00","18:00")],
        fri:[H("09:00","12:00"),H("14:00","18:00")], sat:[H("09:00","12:00"),H("14:00","18:00")],
        sun:[H("09:00","12:00")] }
    }
  ];

  var SCREEN_COUNT = 5;
  var state = { screen:0, filter:"all", clinicId:null, dateIdx:0, slot:null, bookings:[] };
  var bookingSeq = 1;

  function icon(id, cls){ return '<svg class="'+(cls||'')+'" width="20" height="20"><use href="#'+id+'"/></svg>'; }

  function timeToMin(t){ var p=t.split(":"); return (+p[0])*60 + (+p[1]); }

  function isOpenNow(clinic, now){
    var dow = DOW_KEYS[now.getDay()];
    var ranges = clinic.hours[dow];
    if(!ranges) return false;
    var mins = now.getHours()*60 + now.getMinutes();
    for(var i=0;i<ranges.length;i++){
      if(mins >= timeToMin(ranges[i][0]) && mins < timeToMin(ranges[i][1])) return true;
    }
    return false;
  }

  function specTags(clinic){
    return clinic.specs.map(function(k){ return SPECIALTIES[k].label; });
  }

  // ---- render: filter chips ----
  function renderChips(){
    var wrap = document.getElementById("chips");
    var items = [["all","全部"]];
    Object.keys(SPECIALTIES).forEach(function(k){ items.push([k, SPECIALTIES[k].label]); });
    wrap.innerHTML = items.map(function(it){
      var pressed = state.filter === it[0];
      return '<button class="chip" data-filter="'+it[0]+'" aria-pressed="'+pressed+'">'+it[1]+'</button>';
    }).join("");
    wrap.querySelectorAll(".chip").forEach(function(btn){
      btn.addEventListener("click", function(){
        state.filter = btn.getAttribute("data-filter");
        renderChips();
        renderList();
      });
    });
  }

  // ---- render: clinic list ----
  function renderList(){
    var now = new Date();
    var list = CLINICS.filter(function(c){
      return state.filter === "all" || c.specs.indexOf(state.filter) !== -1;
    }).slice().sort(function(a,b){ return a.distanceKm - b.distanceKm; });

    var html = list.map(function(c){
      var open = isOpenNow(c, now);
      var tagsHtml = specTags(c).map(function(t){ return '<span class="tag">'+t+'</span>'; }).join("");
      return (
        '<button class="clinic-card" data-clinic="'+c.id+'">' +
          '<div class="cicon">'+icon(SPECIALTIES[c.specs[0]].icon)+'</div>' +
          '<div class="cbody">' +
            '<div class="crow1"><span class="cname">'+c.name+'</span><span class="cdist">'+c.distanceKm.toFixed(1)+' km</span></div>' +
            '<div class="ctags">'+tagsHtml+'</div>' +
            '<div class="cmeta">' +
              '<span class="star">'+icon("i-star")+'</span><span>'+c.rating+'（'+c.reviews+'）</span>' +
              '<span class="status-pill '+(open?'open':'closed')+'">'+(open?'營業中':'休息中')+'</span>' +
            '</div>' +
          '</div>' +
        '</button>'
      );
    }).join("");

    document.getElementById("clinic-list").innerHTML = html || '<p class="empty-note">目前篩選條件下沒有找到合作診所</p>';
    document.querySelectorAll("[data-clinic]").forEach(function(btn){
      btn.addEventListener("click", function(){
        state.clinicId = btn.getAttribute("data-clinic");
        state.dateIdx = 0; state.slot = null;
        renderDetail();
        goTo(1);
      });
    });
  }

  function findClinic(){ return CLINICS.filter(function(c){ return c.id === state.clinicId; })[0]; }

  // ---- render: detail ----
  function renderDetail(){
    var c = findClinic();
    if(!c) return;
    var now = new Date();
    var open = isOpenNow(c, now);
    var todayKey = DOW_KEYS[now.getDay()];

    var order = ["mon","tue","wed","thu","fri","sat","sun"];
    var wd = {mon:"一",tue:"二",wed:"三",thu:"四",fri:"五",sat:"六",sun:"日"};
    var rows = order.map(function(k){
      var ranges = c.hours[k];
      var text = ranges ? ranges.map(function(r){ return r[0]+"–"+r[1]; }).join("、") : "休診";
      var cls = (k===todayKey) ? "today" : "";
      var offCls = ranges ? "" : "off";
      return '<tr class="'+cls+'"><td>週'+wd[k]+'</td><td class="'+offCls+'">'+text+'</td></tr>';
    }).join("");

    var tagsHtml = specTags(c).map(function(t){ return '<span class="tag">'+t+'</span>'; }).join("");

    document.getElementById("detail-body").innerHTML =
      '<div class="detail-hero">' +
        '<div class="cicon">'+icon(SPECIALTIES[c.specs[0]].icon)+'</div>' +
        '<div>' +
          '<h3 class="display">'+c.name+'</h3>' +
          '<div class="ctags">'+tagsHtml+'</div>' +
        '</div>' +
      '</div>' +
      '<div class="info-card">' +
        '<div class="info-row">'+icon("i-star")+'<span>'+c.rating+' 分（'+c.reviews+' 則評價） · <span class="status-pill '+(open?'open':'closed')+'">'+(open?'營業中':'休息中')+'</span></span></div>' +
        '<div class="info-row">'+icon("i-pin")+'<span>'+c.address+'</span></div>' +
        '<div class="info-row">'+icon("i-phone")+'<span>'+c.phone+'</span></div>' +
        '<div class="info-row">'+icon("i-pin")+'<span class="lbl" style="width:auto;color:var(--text-muted)">距離約 <b style="color:var(--accent-strong)">'+c.distanceKm.toFixed(1)+' 公里</b>（依模擬定位計算）</span></div>' +
      '</div>' +
      '<div class="section-label">診所簡介</div>' +
      '<div class="info-card"><p style="margin:0;font-size:13.5px;line-height:1.7;color:var(--text)">'+c.note+'</p></div>' +
      '<div class="section-label">營業時間</div>' +
      '<div class="info-card"><table class="hours-table">'+rows+'</table></div>';
  }

  // ---- booking screen ----
  function nextDays(n){
    var out = [];
    var base = new Date();
    for(var i=0;i<n;i++){
      var d = new Date(base.getFullYear(), base.getMonth(), base.getDate()+i);
      out.push(d);
    }
    return out;
  }

  function dayLabel(d, idx){
    if(idx===0) return "今天";
    if(idx===1) return "明天";
    return "週"+["日","一","二","三","四","五","六"][d.getDay()];
  }

  // deterministic pseudo-random slot availability
  function hashSlotTaken(clinicId, dateKey, slotLabel){
    var s = clinicId+"|"+dateKey+"|"+slotLabel;
    var h = 0;
    for(var i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
    return (h % 5) === 0; // ~20% of slots pre-booked
  }

  function slotsForDate(clinic, date){
    var dow = DOW_KEYS[date.getDay()];
    var ranges = clinic.hours[dow];
    if(!ranges) return [];
    var slots = [];
    ranges.forEach(function(r){
      var start = timeToMin(r[0]), end = timeToMin(r[1]);
      for(var m=start; m+30<=end; m+=30){
        var hh = Math.floor(m/60), mm = m%60;
        var label = (hh<10?"0":"")+hh+":"+(mm===0?"00":mm);
        slots.push(label);
      }
    });
    return slots;
  }

  function dateKey(d){ return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }

  var DAYS = nextDays(7);

  function renderBooking(){
    var c = findClinic();
    if(!c) return;
    document.getElementById("booking-clinic-name").innerHTML =
      icon(SPECIALTIES[c.specs[0]].icon,'') + ' <span style="margin-left:4px">'+c.name+'</span>';

    var daysHtml = DAYS.map(function(d, idx){
      var pressed = idx === state.dateIdx;
      return '<button class="daybtn" data-day="'+idx+'" aria-pressed="'+pressed+'">' +
        '<span class="dow">'+dayLabel(d, idx)+'</span><span class="dom">'+d.getDate()+'</span></button>';
    }).join("");
    document.getElementById("days").innerHTML = daysHtml;
    document.querySelectorAll("[data-day]").forEach(function(btn){
      btn.addEventListener("click", function(){
        state.dateIdx = +btn.getAttribute("data-day");
        state.slot = null;
        renderBooking();
      });
    });

    var d = DAYS[state.dateIdx];
    var slots = slotsForDate(c, d);
    var dk = dateKey(d);
    var slotArea = document.getElementById("slot-area");
    if(slots.length === 0){
      slotArea.innerHTML = '<p class="empty-note">'+c.name+' 這天休診，請選擇其他日期</p>';
    } else {
      slotArea.innerHTML = '<div class="slot-grid">' + slots.map(function(s){
        var taken = hashSlotTaken(c.id, dk, s);
        var selected = (state.slot === s);
        return '<button class="slot" data-slot="'+s+'" aria-pressed="'+selected+'" '+(taken?'disabled':'')+'>'+s+'</button>';
      }).join("") + '</div>';
      slotArea.querySelectorAll("[data-slot]").forEach(function(btn){
        btn.addEventListener("click", function(){
          state.slot = btn.getAttribute("data-slot");
          renderBooking();
        });
      });
    }

    var summary = document.getElementById("booking-summary");
    var confirmBtn = document.getElementById("btn-confirm");
    if(state.slot){
      summary.hidden = false;
      document.getElementById("booking-summary-text").innerHTML =
        '將預約 <b>'+dayLabel(d,state.dateIdx)+' '+(d.getMonth()+1)+'/'+d.getDate()+'</b> <b>'+state.slot+'</b>';
      confirmBtn.disabled = false;
    } else {
      summary.hidden = true;
      confirmBtn.disabled = true;
    }
  }

  function renderConfirm(){
    var c = findClinic();
    var d = DAYS[state.dateIdx];
    document.getElementById("confirm-card").innerHTML =
      '<div class="crow"><span>診所</span><span>'+c.name+'</span></div>' +
      '<div class="crow"><span>科別</span><span>'+specTags(c).join("、")+'</span></div>' +
      '<div class="crow"><span>日期</span><span>'+(d.getMonth()+1)+'月'+d.getDate()+'日（'+dayLabel(d,state.dateIdx)+'）</span></div>' +
      '<div class="crow"><span>時段</span><span>'+state.slot+'</span></div>' +
      '<div class="crow"><span>地址</span><span>'+c.address+'</span></div>';
  }

  // ---- my bookings ----
  function addBooking(){
    var c = findClinic();
    var d = DAYS[state.dateIdx];
    state.bookings.unshift({
      id: "b" + (bookingSeq++),
      clinicName: c.name,
      specs: specTags(c).join("、"),
      iconKey: SPECIALTIES[c.specs[0]].icon,
      dateText: (d.getMonth()+1)+"月"+d.getDate()+"日（"+dayLabel(d,state.dateIdx)+"）",
      slot: state.slot,
      address: c.address,
      status: "upcoming"
    });
    updateBookingBadge();
  }

  function updateBookingBadge(){
    var badge = document.getElementById("mybookings-badge");
    var count = state.bookings.filter(function(b){ return b.status === "upcoming"; }).length;
    if(count > 0){ badge.hidden = false; badge.textContent = count; }
    else { badge.hidden = true; }
  }

  function renderMyBookings(){
    var body = document.getElementById("mybookings-body");
    if(state.bookings.length === 0){
      body.innerHTML =
        '<div class="mybookings-empty">' +
          icon("i-cal") +
          '<p>目前沒有任何預約紀錄</p>' +
          '<button class="cta" data-nav="0">去找診所預約</button>' +
        '</div>';
      return;
    }
    body.innerHTML = '<div class="booking-list">' + state.bookings.map(function(b){
      var cancelled = b.status === "cancelled";
      return (
        '<div class="booking-item '+(cancelled?'cancelled':'')+'" data-booking="'+b.id+'">' +
          '<div class="bi-top">' +
            '<div class="cicon">'+icon(b.iconKey)+'</div>' +
            '<div>' +
              '<div class="bi-name">'+b.clinicName+'</div>' +
              '<div class="bi-spec">'+b.specs+'</div>' +
            '</div>' +
            '<span class="bi-status '+(cancelled?'cancelled':'upcoming')+'">'+(cancelled?'已取消':'即將到來')+'</span>' +
          '</div>' +
          '<div class="bi-meta">' +
            '<span>'+icon("i-cal")+' '+b.dateText+' '+b.slot+'</span>' +
            '<span class="muted">'+icon("i-pin")+' '+b.address+'</span>' +
          '</div>' +
          '<div class="bi-actions">' +
            (cancelled
              ? '<button class="undo" data-action="undo">復原預約</button>'
              : '<button data-action="cancel">取消預約</button>') +
          '</div>' +
        '</div>'
      );
    }).join("") + '</div>';
  }

  document.getElementById("mybookings-body").addEventListener("click", function(e){
    var btn = e.target.closest("[data-action]");
    if(!btn) return;
    var item = e.target.closest("[data-booking]");
    var id = item.getAttribute("data-booking");
    var b = state.bookings.filter(function(x){ return x.id === id; })[0];
    if(!b) return;
    b.status = (btn.getAttribute("data-action") === "cancel") ? "cancelled" : "upcoming";
    renderMyBookings();
    updateBookingBadge();
  });

  // ---- horizontal drag-to-scroll (mouse) for chip / date rows ----
  function enableDragScroll(el){
    if(!el) return;
    var down = false, startX = 0, startScroll = 0, moved = false;
    el.addEventListener("pointerdown", function(e){
      if(e.pointerType !== "mouse") return;
      down = true; moved = false;
      startX = e.clientX; startScroll = el.scrollLeft;
    });
    el.addEventListener("pointermove", function(e){
      if(!down) return;
      var dx = e.clientX - startX;
      if(Math.abs(dx) > 3) moved = true;
      el.scrollLeft = startScroll - dx;
    });
    function stop(){ down = false; }
    el.addEventListener("pointerup", stop);
    el.addEventListener("pointerleave", stop);
    el.addEventListener("click", function(e){
      if(moved){ e.stopPropagation(); e.preventDefault(); moved = false; }
    }, true);
    el.addEventListener("wheel", function(e){
      if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){
        el.scrollLeft += e.deltaY;
        e.preventDefault();
      }
    }, { passive:false });
  }

  // ---- nav ----
  function goTo(idx){
    state.screen = idx;
    document.getElementById("track").style.transform = "translateX(-"+(idx*(100/SCREEN_COUNT))+"%)";
  }

  document.addEventListener("click", function(e){
    var navBtn = e.target.closest("[data-nav]");
    if(navBtn){ goTo(+navBtn.getAttribute("data-nav")); }
  });

  document.getElementById("btn-to-booking").addEventListener("click", function(){
    renderBooking();
    goTo(2);
  });
  document.getElementById("btn-confirm").addEventListener("click", function(){
    if(!state.slot) return;
    renderConfirm();
    addBooking();
    goTo(3);
  });
  document.getElementById("btn-add-cal").addEventListener("click", function(){
    var btn = document.getElementById("btn-add-cal");
    btn.textContent = "已加入行事曆 ✓";
    setTimeout(function(){ btn.textContent = "加入行事曆提醒"; }, 2200);
  });
  document.getElementById("btn-view-bookings").addEventListener("click", function(){
    renderMyBookings();
    goTo(4);
  });
  document.getElementById("btn-done").addEventListener("click", function(){
    state.clinicId = null; state.slot = null; state.dateIdx = 0;
    renderChips(); renderList();
  });
  document.getElementById("btn-my-bookings").addEventListener("click", function(){
    renderMyBookings();
    goTo(4);
  });

  // ---- intro modal ----
  var introBackdrop = document.getElementById("introBackdrop");
  function closeIntro(){ introBackdrop.hidden = true; }
  document.getElementById("introClose").addEventListener("click", closeIntro);
  document.getElementById("introStart").addEventListener("click", closeIntro);
  introBackdrop.addEventListener("click", function(e){
    if(e.target === introBackdrop) closeIntro();
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && !introBackdrop.hidden) closeIntro();
  });

  // init
  renderChips();
  renderList();
  enableDragScroll(document.getElementById("chips"));
  enableDragScroll(document.getElementById("days"));
  updateBookingBadge();
})();
</script>
